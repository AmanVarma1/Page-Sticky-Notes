<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="popup.css">
  <script src="theme.js"></script>
</head>
<body>
  <header>
    <h1>📝 Page Sticky Notes</h1>
    <button id="settings" class="icon" title="Settings, sync &amp; backup">⚙</button>
  </header>

  <div class="actions">
    <button id="add" class="primary">+ Add note</button>
    <button id="hl" title="Highlight the selected text on the page and attach a note">🖍 Highlight</button>
    <button id="toggle" title="Show / hide notes on this page">👁</button>
  </div>
  <div id="msg" class="msg" hidden></div>

  <div class="tabs">
    <button data-scope="page" class="active">This page <span id="cPage"></span></button>
    <button data-scope="all">All notes <span id="cAll"></span></button>
    <button id="aiTab" data-view="ai">🤖 Ask AI</button>
  </div>

  <section id="notesView">
    <input id="search" type="search" placeholder="Search notes…" autocomplete="off">
    <ul id="list"></ul>
    <div id="empty" class="empty" hidden></div>
  </section>

  <section id="aiPanel" hidden>
    <div class="ai-context">
      <label><input id="aiUsePage" type="checkbox"> Page text</label>
      <label><input id="aiUseHighlights" type="checkbox" checked> Highlights</label>
      <label><input id="aiUseNotes" type="checkbox" checked> Notes:</label>
      <select id="aiNoteScope" aria-label="Which notes to include">
        <option value="page">this page</option>
        <option value="all">all notes</option>
      </select>
    </div>

    <div id="aiNoKey" class="ai-no-key" hidden>
      Add your Groq API key in <button id="aiOpenSettings" type="button" class="ai-link">Settings</button> to start chatting.
    </div>

    <p class="ai-intro">Ask anything about this page, your highlights or your notes.</p>
    <div id="aiSuggestions" class="ai-suggestions">
      <button type="button" data-ai-prompt="Summarize this page in clear bullet points.">Summarize this page</button>
      <button type="button" data-ai-prompt="Explain my highlights in simple words.">Explain my highlights in simple words</button>
      <button type="button" data-ai-prompt="Turn my notes into a practical checklist.">Turn my notes into a checklist</button>
      <button type="button" data-ai-prompt="Quiz me with 5 questions based on this page. Ask one question at a time.">Quiz me with 5 questions on this page</button>
    </div>

    <div id="aiChat" class="ai-chat" aria-live="polite"></div>
    <form id="aiForm" class="ai-compose">
      <textarea id="aiQuestion" rows="2" maxlength="2000" placeholder="Ask anything about this page, your highlights or notes…" required></textarea>
      <button id="aiSend" class="primary" type="submit">Send</button>
    </form>
    <div class="ai-bottom-row">
      <span id="aiStatus" role="status">Groq · openai/gpt-oss-20b</span>
      <button id="aiClear" type="button" class="ai-link">Clear chat</button>
    </div>
  </section>

  <footer>Alt+Shift+N add &nbsp;·&nbsp; Alt+Shift+L highlight &nbsp;·&nbsp; Alt+Shift+H hide/show</footer>
  <script src="md.js"></script>
  <script src="popup.js"></script>
</body>
</html>
